<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#161616"/>
  <text x="600" y="62" fill="#ff8c42" font-size="40" font-weight="700" text-anchor="middle" direction="rtl">لِماذا يَسوَدُّ الدُّخان؟</text>

  <line x1="600" y1="110" x2="600" y2="500" stroke="#333" stroke-width="2"/>

  <!-- ===== LEFT: starved, smoky flame ===== -->
  <g transform="translate(330,430)">
    <!-- black smoke -->
    <circle cx="-6" cy="-110" r="26" fill="#5a5a5a" opacity="0.75"/>
    <circle cx="14" cy="-150" r="34" fill="#444" opacity="0.8"/>
    <circle cx="-18" cy="-190" r="40" fill="#333" opacity="0.85"/>
    <circle cx="10" cy="-235" r="48" fill="#2a2a2a" opacity="0.9"/>
    <!-- small weak flame -->
    <path d="M0,0 C20,-16 13,-46 0,-72 C-13,-46 -20,-16 0,0 Z" fill="#e8642b"/>
    <path d="M0,-6 C11,-18 7,-40 0,-58 C-7,-40 -11,-18 0,-6 Z" fill="#f7a83b"/>
    <text x="0" y="58" fill="#ff6b6b" font-size="32" font-weight="700" text-anchor="middle" direction="rtl">هَواءٌ قَليل</text>
    <text x="0" y="98" fill="#cfcfcf" font-size="25" text-anchor="middle" direction="rtl">دُخانٌ أسوَدُ، سُخامٌ، سُموم</text>
  </g>

  <!-- ===== RIGHT: fed, clean flame ===== -->
  <g transform="translate(850,430)">
    <!-- faint thin smoke -->
    <circle cx="2" cy="-200" r="14" fill="#666" opacity="0.3"/>
    <circle cx="-6" cy="-228" r="11" fill="#666" opacity="0.22"/>
    <!-- tall clean flame -->
    <path d="M0,0 C30,-30 20,-95 0,-150 C-20,-95 -30,-30 0,0 Z" fill="#ff8c2b"/>
    <path d="M0,-4 C18,-30 12,-80 0,-120 C-12,-80 -18,-30 0,-4 Z" fill="#ffd23b"/>
    <path d="M0,2 C16,-10 14,-34 0,-52 C-14,-34 -16,-10 0,2 Z" fill="#5ab0ff"/>
    <!-- air arrows in at base -->
    <g stroke="#5ab0ff" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="-95" y1="6" x2="-40" y2="-2"/>
      <line x1="95" y1="6" x2="40" y2="-2"/>
    </g>
    <path d="M-40,-2 L-56,-12 L-54,4 Z" fill="#5ab0ff"/>
    <path d="M40,-2 L56,-12 L54,4 Z" fill="#5ab0ff"/>
    <text x="0" y="58" fill="#6ddf6d" font-size="32" font-weight="700" text-anchor="middle" direction="rtl">هَواءٌ كَثيرٌ وحَرارة</text>
    <text x="0" y="98" fill="#cfcfcf" font-size="25" text-anchor="middle" direction="rtl">احتِراقٌ أنظَفُ بِكَثير</text>
  </g>

  <!-- ===== bottom banner: two enemies ===== -->
  <rect x="140" y="555" width="920" height="95" rx="16" fill="#241c14" stroke="#ff8c42" stroke-width="2"/>
  <text x="600" y="592" fill="#ffd54f" font-size="29" font-weight="700" text-anchor="middle" direction="rtl">عَدُوّانِ نَتَغَلَّبُ عَلَيْهِما</text>
  <text x="840" y="632" fill="#f0f0f0" font-size="26" text-anchor="middle" direction="rtl">١ — بَلاستيكٌ فيهِ كلور</text>
  <text x="370" y="632" fill="#f0f0f0" font-size="26" text-anchor="middle" direction="rtl">٢ — لَهَبٌ جائِعٌ لِلهَواء</text>
</svg>
