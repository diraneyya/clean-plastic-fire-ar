<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#161616"/>
  <text x="600" y="58" fill="#6ddf6d" font-size="38" font-weight="700" text-anchor="middle" direction="rtl">أينَ تَقِفينَ، وكَيْفَ تَأمَنين</text>

  <!-- 2x2 grid of safety rules -->
  <!-- top-right cell: wind at your back -->
  <g transform="translate(620,90)">
    <rect x="0" y="0" width="490" height="240" rx="18" fill="#1e2620" stroke="#3a4a3a" stroke-width="2"/>
    <!-- person -->
    <circle cx="120" cy="95" r="22" fill="#cfcfcf"/>
    <rect x="104" y="118" width="32" height="60" rx="10" fill="#cfcfcf"/>
    <!-- wind arrows from behind -->
    <g stroke="#5ab0ff" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="60" y1="80" x2="95" y2="80"/>
      <line x1="50" y1="110" x2="95" y2="110"/>
      <line x1="60" y1="140" x2="95" y2="140"/>
    </g>
    <path d="M95,80 L82,73 L82,87 Z" fill="#5ab0ff"/>
    <path d="M95,110 L82,103 L82,117 Z" fill="#5ab0ff"/>
    <path d="M95,140 L82,133 L82,147 Z" fill="#5ab0ff"/>
    <!-- little fire downwind -->
    <path d="M210,150 C222,138 216,120 210,108 C204,120 198,138 210,150 Z" fill="#ff8c2b"/>
    <text x="370" y="100" fill="#f0f0f0" font-size="26" font-weight="700" text-anchor="middle" direction="rtl">الرّيحُ خَلْفَ ظَهرِكِ</text>
    <text x="350" y="138" fill="#9a9a9a" font-size="21" text-anchor="middle" direction="rtl">فَيَبتَعِدُ الدُّخانُ عَنْ وَجهِكِ</text>
  </g>

  <!-- top-left cell: away from tents -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="490" height="240" rx="18" fill="#26201e" stroke="#4a3a3a" stroke-width="2"/>
    <!-- tent -->
    <path d="M70,170 L130,80 L190,170 Z" fill="none" stroke="#cfcfcf" stroke-width="4"/>
    <line x1="130" y1="80" x2="130" y2="170" stroke="#cfcfcf" stroke-width="3"/>
    <!-- fire far -->
    <path d="M300,165 C312,153 306,135 300,123 C294,135 288,153 300,165 Z" fill="#ff8c2b"/>
    <!-- distance dashes -->
    <line x1="195" y1="165" x2="285" y2="165" stroke="#ffb74d" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="360" y="100" fill="#f0f0f0" font-size="26" font-weight="700" text-anchor="middle" direction="rtl">اِبقَيْ بَعيدًا عَنِ الخِيام</text>
    <text x="350" y="138" fill="#9a9a9a" font-size="21" text-anchor="middle" direction="rtl">البَلاستيكُ يَطيرُ مُشتَعِلًا</text>
  </g>

  <!-- bottom-right cell: bucket ready -->
  <g transform="translate(620,355)">
    <rect x="0" y="0" width="490" height="240" rx="18" fill="#1c2228" stroke="#33414a" stroke-width="2"/>
    <!-- bucket -->
    <path d="M95,95 L185,95 L172,185 L108,185 Z" fill="#4a6a8a"/>
    <ellipse cx="140" cy="95" rx="45" ry="11" fill="#5e84a8"/>
    <path d="M100,95 A40 30 0 0 1 180 95" fill="none" stroke="#9a9a9a" stroke-width="4"/>
    <!-- water shimmer -->
    <ellipse cx="140" cy="110" rx="34" ry="7" fill="#7fb0d8" opacity="0.7"/>
    <text x="370" y="100" fill="#f0f0f0" font-size="26" font-weight="700" text-anchor="middle" direction="rtl">دَلوُ ماءٍ أو رَملٍ</text>
    <text x="395" y="138" fill="#f0f0f0" font-size="26" font-weight="700" text-anchor="middle" direction="rtl">قُربَكِ دائِمًا</text>
  </g>

  <!-- bottom-left cell: cover nose + kids away -->
  <g transform="translate(90,355)">
    <rect x="0" y="0" width="490" height="240" rx="18" fill="#241e26" stroke="#403a4a" stroke-width="2"/>
    <!-- face with cloth -->
    <circle cx="130" cy="110" r="40" fill="none" stroke="#cfcfcf" stroke-width="4"/>
    <rect x="96" y="112" width="68" height="34" rx="8" fill="#8aa0c0"/>
    <line x1="96" y1="120" x2="80" y2="106" stroke="#cfcfcf" stroke-width="3"/>
    <line x1="164" y1="120" x2="180" y2="106" stroke="#cfcfcf" stroke-width="3"/>
    <text x="370" y="95" fill="#f0f0f0" font-size="26" font-weight="700" text-anchor="middle" direction="rtl">غَطّي أنفَكِ</text>
    <text x="345" y="133" fill="#9a9a9a" font-size="21" text-anchor="middle" direction="rtl">عِندَ الإشعالِ والتَّحريك،</text>
    <text x="360" y="166" fill="#9a9a9a" font-size="21" text-anchor="middle" direction="rtl">والأطفالُ بَعيدونَ عَنِ النّار</text>
  </g>
</svg>
